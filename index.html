<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Blast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background -->
  <canvas id="bg-canvas"></canvas>
  <!-- Floating score popups -->
  <div id="popup-layer"></div>

  <div id="app">
    <header>
      <h1>Block<br>Blast</h1>
      <div id="score-area">
        <div class="score-box">
          <span class="label">Punkte</span>
          <span id="score">0</span>
        </div>
        <div class="score-box best">
          <span class="label">Rekord</span>
          <span id="highscore">0</span>
        </div>
      </div>
    </header>

    <main>
      <div id="grid-wrapper">
        <canvas id="grid-canvas"></canvas>
        <div id="overlay" class="hidden">
          <div id="overlay-content">
            <div id="overlay-emoji">💥</div>
            <h2>Spiel vorbei!</h2>
            <p>Punkte: <strong id="final-score">0</strong></p>
            <button id="restart-btn">Nochmal spielen</button>
          </div>
        </div>
      </div>

      <div id="piece-tray">
        <div class="piece-slot"><canvas id="piece-0" class="piece-canvas"></canvas></div>
        <div class="piece-slot"><canvas id="piece-1" class="piece-canvas"></canvas></div>
        <div class="piece-slot"><canvas id="piece-2" class="piece-canvas"></canvas></div>
      </div>
    </main>
  </div>

  <canvas id="drag-canvas"></canvas>
  <script src="game.js"></script>
</body>
</html>
